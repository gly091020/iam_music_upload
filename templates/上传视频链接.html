<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>链接音频下载 | Iam Music Player中转站</title>
    <style>
        :root {
            --primary-color: #007bff;
            --hover-color: #0056b3;
            --background-color: #f8f9fa;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 15px;
            box-sizing: border-box;
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.2em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .download-card {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .url-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .url-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
            outline: none;
        }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .submit-btn:hover {
            background-color: var(--hover-color);
            transform: translateY(-1px);
        }

        .notice-text {
            text-align: center;
            color: #6c757d;
            margin-top: 1.5rem;
            font-size: 0.9em;
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 10px;
            }
            .download-card {
                padding: 1.5rem;
            }
            .url-input {
                padding: 10px 15px;
            }
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="download-card">
            <h1>链接音频下载</h1>
            <form action="_url_upload" method="get">
                <div class="form-group">
                    <input
                        type="url"
                        name="url"
                        class="url-input"
                        placeholder="请输入视频链接"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" class="submit-btn">
                        <span>解析并下载音频</span>
                    </button>
                </div>
            </form>
        </div>
        <p class="notice-text">当前支持平台：哔哩哔哩 (Bilibili)、 YouTube</p>
    </div>
</body>
</html>
